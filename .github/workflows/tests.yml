name: Tests

# Tests automatisés Sodales sur une base PostgreSQL jetable :
# autorisations (REST + sockets), synchronisation carte/jetons, règles de fiche.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  authz:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: rpg
          POSTGRES_PASSWORD: rpg
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U rpg"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PG_SUPER_URL: postgres://rpg:rpg@127.0.0.1:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Dépendances
        working-directory: backend
        run: npm ci
      - name: Tests (autorisations + synchro carte/jetons + règles de fiche)
        working-directory: backend
        run: npm test
