<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Sodales — Réglages de campagne</title>
<link rel="icon" href="/favicon.ico?v=2026.09.001" sizes="any"/>
<link rel="icon" type="image/png" href="/favicon.png?v=2026.09.001"/>
<link rel="apple-touch-icon" href="/apple-touch-icon.png?v=2026.09.001"/>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Inter:wght@300;400;500&display=swap" rel="stylesheet"/>
<script src="/js/csp-actions.js?v=2"></script>
  <script defer src="/script.js" data-website-id="f30f0aac-dc25-407f-8f70-cc389c9df496"></script>
<style>
:root{--bg:#0e0e14;--surface:#16161f;--surface2:#1e1e2a;--surface3:#242430;--border:#2a2a3a;--accent:#c9a227;--accent2:#8b5cf6;--text:#e8e0d0;--text2:#9990a8;--danger:#ef4444;--success:#22c55e;}
*{box-sizing:border-box;margin:0;padding:0;}
body{background:var(--bg);color:var(--text);font-family:'Inter',sans-serif;min-height:100vh;}

header{background:var(--surface);border-bottom:1px solid var(--border);padding:.75rem 1.5rem;display:flex;align-items:center;gap:1rem;}
.logo{font-family:'Cinzel',serif;color:var(--accent);font-size:1rem;text-decoration:none;}
.logo .brand-ico{height:28px;vertical-align:middle;margin-right:.45rem;}
.header-title{font-family:'Cinzel',serif;font-size:.95rem;color:var(--text2);}
.spacer{flex:1;}
.btn-back{background:none;border:1px solid var(--border);color:var(--text2);padding:.35rem .8rem;border-radius:7px;cursor:pointer;font-size:.82rem;text-decoration:none;transition:.2s;}
.btn-back:hover{border-color:var(--accent);color:var(--accent);}

.page{max-width:740px;margin:0 auto;padding:2rem 1.5rem;}

.section{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:1.5rem;margin-bottom:1.5rem;}
.section-title{font-family:'Cinzel',serif;color:var(--accent);font-size:.9rem;margin-bottom:1.2rem;display:flex;align-items:center;gap:.5rem;}

.form-grid{display:grid;gap:.9rem;}
.fg{display:flex;flex-direction:column;gap:.35rem;}
.fg label{font-size:.78rem;color:var(--text2);font-weight:500;}
.fg input,.fg textarea,.fg select{background:var(--surface2);border:1px solid var(--border);color:var(--text);padding:.55rem .75rem;border-radius:8px;font-size:.875rem;font-family:'Inter',sans-serif;outline:none;transition:.15s;width:100%;}
.fg input:focus,.fg textarea:focus,.fg select:focus{border-color:var(--accent2);}
.fg textarea{resize:vertical;min-height:80px;}
.fg-row{display:grid;grid-template-columns:1fr 1fr;gap:.9rem;}

/* Invite code */
.invite-row{display:flex;gap:.5rem;align-items:center;}
.invite-row input{flex:1;font-family:monospace;font-size:1rem;letter-spacing:.1em;font-weight:600;color:var(--accent);}
.btn-sm{padding:.38rem .8rem;border:1px solid var(--border);background:none;color:var(--text2);border-radius:7px;cursor:pointer;font-size:.78rem;transition:.2s;white-space:nowrap;}
.btn-sm:hover{border-color:var(--accent);color:var(--accent);}
.btn-sm.danger:hover{border-color:var(--danger);color:var(--danger);}

/* Radio pills */
.radio-group{display:flex;gap:.4rem;flex-wrap:wrap;}
.radio-pill input{display:none;}
.radio-pill label{display:inline-block;padding:.35rem .75rem;border:1px solid var(--border);border-radius:20px;font-size:.8rem;cursor:pointer;transition:.15s;color:var(--text2);}
.radio-pill input:checked + label{border-color:var(--accent);background:rgba(201,162,39,.12);color:var(--accent);}
.radio-pill label:hover{border-color:var(--text2);color:var(--text);}

/* Thresholds */
.threshold-row{display:flex;align-items:center;gap:.6rem;margin-top:.5rem;}
.threshold-item{display:flex;align-items:center;gap:.4rem;font-size:.82rem;color:var(--text2);}
.threshold-item input{width:56px;background:var(--surface2);border:1px solid var(--border);color:var(--text);padding:.35rem .4rem;border-radius:7px;font-size:.85rem;text-align:center;outline:none;}
.threshold-item input:focus{border-color:var(--accent2);}
.bar-preview{display:flex;gap:.3rem;align-items:center;margin-top:.7rem;}
.bar-seg{height:10px;border-radius:3px;flex:1;transition:.3s;}

/* Save button */
.btn-save{background:linear-gradient(135deg,var(--accent),#a07c18);color:#0e0e14;border:none;border-radius:8px;padding:.65rem 1.6rem;font-size:.9rem;font-weight:600;cursor:pointer;transition:.2s;display:flex;align-items:center;gap:.5rem;}
.btn-save:hover{filter:brightness(1.1);}
.btn-save:disabled{opacity:.5;cursor:not-allowed;}
.save-row{display:flex;align-items:center;gap:1rem;margin-top:.5rem;}
.save-status{font-size:.82rem;color:var(--success);opacity:0;transition:.3s;}
.save-status.visible{opacity:1;}
.save-status.error{color:var(--danger);}

.hint{font-size:.73rem;color:var(--text2);margin-top:.25rem;}

/* Members list */
.members-grid{display:flex;flex-direction:column;gap:.5rem;}
.member-row{display:flex;align-items:center;gap:.65rem;padding:.55rem .7rem;background:var(--surface2);border:1px solid var(--border);border-radius:8px;}
.member-avatar{width:30px;height:30px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:.72rem;font-weight:700;color:#0e0e14;flex-shrink:0;}
.member-name{flex:1;font-size:.85rem;}
.member-role{font-size:.72rem;padding:.15rem .5rem;border-radius:20px;}
.role-gm{background:rgba(201,162,39,.15);color:var(--accent);}
.role-player{background:rgba(139,92,246,.15);color:var(--accent2);}

/* Danger zone */
.danger-section{border-color:rgba(239,68,68,.25);}
.danger-section .section-title{color:var(--danger);}
</style>
<script src="/js/systems.js?v=3"></script>
</head>
<body>

<header>
  <a class="logo" href="/lobby.html"><img class="brand-ico" src="/img/sodales-icon.png" alt=""/>Sodales</a>
  <span class="header-title" id="headerTitle">Réglages de campagne</span>
  <div class="spacer"></div>
  <a class="btn-back" href="/lobby.html">← Lobby</a>
</header>

<main class="page" id="pageContent">
  <div style="text-align:center;padding:3rem;color:var(--text2);">Chargement…</div>
</main>

<script src="/js/page/campaign-settings.js?v=3"></script>
  <script src="/js/csp-registry.js?v=2"></script>
</body>
</html>
